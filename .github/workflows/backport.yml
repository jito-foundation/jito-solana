name: Backport

on:
  pull_request_target:
    types:
      - closed
      - labeled
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'PR number to backport'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    strategy:
      matrix:
        target: [v3.1, v4.0, v4.1, v4.2]
    if: >
      github.event_name == 'workflow_dispatch' || (
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'master' &&
        !contains(github.event.pull_request.labels.*.name, 'feature-gate')
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_NUMBER_INPUT: ${{ inputs.pull_number }}
          PR_NUMBER_PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$PULL_NUMBER_INPUT"
            LABELS=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json labels -q '[.labels[].name]')
          else
            PR_NUMBER="$PR_NUMBER_PR"
            LABELS="$PR_LABELS_JSON"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if echo "$LABELS" | jq -e --arg t "$MATRIX_TARGET" 'index($t)' > /dev/null 2>&1; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.pr.outputs.match == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import backport signing key
        if: steps.pr.outputs.match == 'true'
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Create backport PR
        if: steps.pr.outputs.match == 'true'
        uses: korthout/backport-action@d07416681cab29bf2661702f925f020aaa962997 # v3.4.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: ${{ steps.import-gpg.outputs.name }}
          git_committer_email: ${{ steps.import-gpg.outputs.email }}
          experimental: '{"conflict_resolution":"draft_commit_conflicts"}'
          label_pattern: ''
          target_branches: ${{ matrix.target }}
          pull_title: '${target_branch}: ${pull_title} (backport of #${pull_number})'
          pull_description: |
            Backport of #${pull_number} to `${target_branch}`.

            This PR was created automatically from a merged `master` PR labeled `${target_branch}`.
