[package]
name = "jito-scheduler"
description = "Jito scheduling policy over Agave shared-memory bindings"
version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
dev-context-only-utils = []

[dependencies]
agave-scheduler-bindings = { workspace = true }
agave-scheduling-utils = { workspace = true, features = ["agave-unstable-api"] }
agave-transaction-view = { workspace = true }
jito-scheduler-bindings = { path = "../jito-scheduler-bindings" }
rts-alloc = { workspace = true }
solana-pubkey = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
agave-logger = { workspace = true }
arc-swap = { workspace = true }
crossbeam-channel = { workspace = true }
jito-protos = { workspace = true }
solana-commitment-config = { workspace = true }
solana-core = { workspace = true, features = ["dev-context-only-utils"] }
solana-hash = { workspace = true }
solana-keypair = { workspace = true }
solana-local-cluster = { workspace = true, features = ["dev-context-only-utils"] }
solana-message = { workspace = true }
solana-net-utils = { workspace = true }
solana-rent = { workspace = true }
solana-signature = { workspace = true, features = ["verify"] }
solana-signer = { workspace = true }
solana-system-transaction = { workspace = true }
solana-transaction = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["codegen", "router", "server"] }
wincode = { workspace = true }

[lints]
workspace = true
